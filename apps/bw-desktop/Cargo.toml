[package]
name = "bw-desktop"
description = "Desktop darkroom: browse images, preview black-and-white styles, export prints."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bw-darkroom"
path = "src/main.rs"

[dependencies]
bw-core = { path = "../../crates/bw-core" }
bw-negative = { path = "../../crates/bw-negative" }
bw-io = { path = "../../crates/bw-io" }
bw-profiles = { path = "../../crates/bw-profiles" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.17"
dirs = "7"
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
