[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
rayon = "1.10"
thiserror = "2"
proptest = "1"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1

[profile.test]
opt-level = 2
